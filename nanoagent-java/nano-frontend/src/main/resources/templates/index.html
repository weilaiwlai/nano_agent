<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">NanoAgent</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1 class="sidebar-title">NanoAgent</h1>
                <button class="sidebar-toggle" id="sidebarToggle" title="收起侧边栏">☰</button>
            </div>

            <div class="sidebar-section" id="healthSection">
                <div class="health-indicator" id="healthIndicator">
                    <span class="health-dot"></span>
                    <span class="health-text">检测中...</span>
                </div>
            </div>

            <div class="sidebar-section">
                <label class="sidebar-label">用户 ID</label>
                <input type="text" class="sidebar-input" id="userIdInput" placeholder="user_001" value="user_001">
                <span class="sidebar-hint" id="userIdHint">手动用户 ID 模式（本地调试）</span>
            </div>

            <div class="sidebar-section">
                <div class="section-header" data-panel="conversationPanel">
                    <span>对话管理</span>
                    <span class="section-arrow">▼</span>
                </div>
                <div class="section-content" id="conversationPanel">
                    <button class="btn btn-primary btn-full" id="newConvBtn">新建对话</button>
                    <div class="conv-list" id="convList"></div>
                    <button class="btn btn-danger btn-full" id="deleteConvBtn" style="display:none;">删除当前对话</button>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="section-header" data-panel="aiConfigPanel">
                    <span>AI 配置</span>
                    <span class="section-arrow">▶</span>
                </div>
                <div class="section-content collapsed" id="aiConfigPanel">
                    <button class="btn btn-sm btn-full" id="refreshProvidersBtn">刷新模型列表</button>
                    <label class="sidebar-label">模型提供商</label>
                    <select class="sidebar-input" id="providerSelect"></select>
                    <label class="sidebar-label">模型名称</label>
                    <select class="sidebar-input" id="modelSelect"></select>
                    <input type="text" class="sidebar-input" id="customModelInput" placeholder="自定义模型名称" style="display:none;">
                    <label class="sidebar-label">API Key</label>
                    <input type="password" class="sidebar-input" id="apiKeyInput" placeholder="请输入 API Key">
                    <div id="baseUrlGroup" style="display:none;">
                        <label class="sidebar-label">Base URL</label>
                        <input type="text" class="sidebar-input" id="baseUrlInput" placeholder="https://your-provider.example.com/v1">
                    </div>
                    <label class="sidebar-label">Embedding 模型（可选）</label>
                    <input type="text" class="sidebar-input" id="embeddingModelInput" placeholder="留空表示不启用">
                    <div class="btn-row">
                        <button class="btn btn-sm" id="validateBtn">验证连接</button>
                        <button class="btn btn-sm btn-primary" id="activateBtn">保存并启用</button>
                    </div>
                    <div id="validationResult" class="validation-result"></div>
                    <div id="activeSessionInfo" class="session-info"></div>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="section-header" data-panel="memoryPanel">
                    <span>长期记忆</span>
                    <span class="section-arrow">▶</span>
                </div>
                <div class="section-content collapsed" id="memoryPanel">
                    <textarea class="sidebar-textarea" id="memoryText" placeholder="例如：我是一名计算机专业学生。" rows="3"></textarea>
                    <button class="btn btn-primary btn-full" id="saveMemoryBtn">保存偏好</button>
                    <button class="btn btn-sm btn-full" id="refreshMemoryBtn">刷新记忆列表</button>
                    <div id="memoryList" class="memory-list"></div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="chat-header">
                <h2 class="chat-title">NanoAgent</h2>
                <div class="chat-meta">
                    <span class="chat-user" id="chatUserDisplay"></span>
                    <span class="chat-session" id="chatSessionDisplay"></span>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="welcome-message">
                    <div class="welcome-icon">🤖</div>
                    <h3>欢迎使用 NanoAgent</h3>
                    <p>多智能体协作系统，支持知识检索、报告生成、数据分析等功能。</p>
                </div>
            </div>

            <div class="interrupt-panel" id="interruptPanel" style="display:none;">
                <div class="interrupt-header">⚠️ Agent 申请执行以下工具，请审批：</div>
                <div class="interrupt-calls" id="interruptCalls"></div>
                <div class="interrupt-actions">
                    <button class="btn btn-success" id="approveBtn">✅ 允许执行</button>
                    <button class="btn btn-danger" id="rejectBtn">❌ 拒绝执行</button>
                </div>
            </div>

            <div class="chat-input-area">
                <div class="chat-input-row">
                    <textarea class="chat-input" id="chatInput" placeholder="请输入你的问题..." rows="1" disabled></textarea>
                    <button class="btn btn-primary btn-send" id="sendBtn" disabled>发送</button>
                    <button class="btn btn-warning btn-send" id="stopBtn" style="display:none;">暂停</button>
                </div>
            </div>
        </main>
    </div>

    <script th:inline="javascript">
        window.AGENT_API_BASE_URL = /*[[${agentApiBaseUrl}]]*/ 'http://localhost:8080';
        window.AGENT_API_TOKEN = /*[[${agentApiToken}]]*/ '';
    </script>
    <script src="/js/app.js"></script>
</body>
</html>
